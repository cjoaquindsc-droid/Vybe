/* ---- módulo: calendario.css ---- */
/* ============================================================================
   calendario.css · Pantalla Calendario · The Pisco Room
   Colores validados sobre fondo oscuro (ver pruebas/modulos/calendario.js):
   venta real #b38e22 · meta del día #4f8ad0 · olas: rampa dorada ordinal.

:root {

/* ---------- cabecera y navegación ---------- */
.cal-vistas { display: inline-flex; gap: 4px; }

<script>
/* ---- módulo: calendario.js ---- */
/* ============================================================================
   calendario.js · Pantalla Calendario (parte 2) · CRM B2C Viñas de Oro

   edición por día (lateral en laptop, modal en celular), resumen por mes con
   gráfica SVG de meta del día vs venta real, recálculo desde metas y CSV.
   Usa solo la API pública window.VDO (ver docs/MODULOS.md).
   ========================================================================== */
(function () {
  'use strict';
  var V = window.VDO, U = V.util, UI = V.ui, R = V.reglas, DB = V.DB, cfg = V.cfg;

  var ESTADOS = [
    { valor: 'pendiente', texto: 'Pendiente' },
    { valor: 'en_curso', texto: 'En curso' },
    { valor: 'cumplido', texto: 'Cumplido' },
    { valor: 'no_cumplido', texto: 'No cumplido' }
  ];
  var NOMBRE_ESTADO = { pendiente: 'Pendiente', en_curso: 'En curso', cumplido: 'Cumplido', no_cumplido: 'No cumplido' };
  var CABECERA_GRILLA = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
  var ESTADOS_VENTA_REAL = ['pagado', 'entregado'];

  var diaAbierto = '';      // fecha abierta en el panel lateral (laptop)
  var timerResize = null;

  /* =========================== Estado de la pantalla =========================== */
  function esMovil() { return !!(window.matchMedia && window.matchMedia('(max-width: 820px)').matches); }
  function mesesDelCalendario() {
    var m = {}; DB.tabla('calendario').forEach(function (d) { var k = U.mesDe(d.fecha); if (k) m[k] = true; });
    return Object.keys(m).sort();
  }
  function mesMasCercano(meses, ym) {
    if (!meses.length) return '';
    if (meses.indexOf(ym) >= 0) return ym;
    return ym < meses[0] ? meses[0] : meses[meses.length - 1];
  }
  // Filtros persistentes en DB.datos.ui.filtros.calendario (vista, mes visible, ola, estado, alcance de la lista)
  function estadoUI() {
    var f = DB.datos.ui.filtros.calendario;
    if (!f || typeof f !== 'object' || Array.isArray(f)) { f = { vista: 'mes', mes: '', ola: '', estado: '', alcance: 'mes' }; DB.datos.ui.filtros.calendario = f; }
    if (f.vista !== 'lista') f.vista = 'mes';
    if (f.alcance !== 'todo') f.alcance = 'mes';
    var meses = mesesDelCalendario();
    if (meses.indexOf(f.mes) < 0) f.mes = mesMasCercano(meses, U.mesDe(U.hoyISO()));
    return f;
  }

  /* =========================== Datos reales por día =========================== */
  // Ventas que cuentan (pagado o entregado, no B2B) por fecha de cierre o fecha, e interacciones por día
  function datosReales() {
    var ventas = {}, enviados = {};
    DB.tabla('ventas').forEach(function (v) {
      if (ESTADOS_VENTA_REAL.indexOf(v.estado) < 0 || v.derivarB2B) return;
      var f = U.isoDe(v.fechaCierre) || U.isoDe(v.fecha); if (!f) return;
      (ventas[f] = ventas[f] || []).push(v);
    });
    DB.tabla('interacciones').forEach(function (i) {
      var f = U.isoDe(String(i.fecha || '').slice(0, 10)); if (!f) return;
      (enviados[f] = enviados[f] || []).push(i);
    });
    return { ventas: ventas, enviados: enviados };
  }
  function ventaDe(reales, fecha) { return (reales.ventas[fecha] || []).reduce(function (s, v) { return s + (Number(v.total) || 0); }, 0); }
  function enviadosDe(reales, fecha) { return (reales.enviados[fecha] || []).length; }
  function contactosDe(dia) { var c = dia.cuotas || {}; return Object.keys(c).reduce(function (s, k) { return s + (Number(c[k]) || 0); }, 0); }
  function diasDelMes(mes) { return DB.tabla('calendario').filter(function (d) { return U.mesDe(d.fecha) === mes; }).sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; }); }
  function olaInfo(n) { return cfg().olas.filter(function (o) { return o.n === n; })[0] || null; }
  function nombreOla(n) { var o = olaInfo(n); return o ? o.nombre : 'Ola ' + n; }
  function recortar(txt, n) { txt = String(txt || ''); return txt.length > n ? txt.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : txt; }
  function compacto(n) { n = Number(n) || 0; return n >= 10000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : U.entero(n); }
  // Día recalculado desde las metas y el plan actual (misma fecha), sin tocar lo guardado
  function diaDelPlan(fecha) { return V.generarCalendario(cfg()).filter(function (d) { return d.fecha === fecha; })[0] || null; }
  function mismasCuotas(a, b) {
    a = a || {}; b = b || {};
    var claves = {}; Object.keys(a).concat(Object.keys(b)).forEach(function (k) { claves[k] = true; });
    return Object.keys(claves).every(function (k) { return (Number(a[k]) || 0) === (Number(b[k]) || 0); });
  }

  /* =========================== Resumen por mes =========================== */
  function resumenMes(mes, reales) {
    var M = cfg().metas; var dias = diasDelMes(mes);
    var r = { mes: mes, dias: dias.length, cumplidos: 0, noCumplidos: 0, pendientes: 0, enCurso: 0, sumaMetas: 0, sumaCuotas: 0, proyeccion: Number(M.proyeccion[mes]) || 0, cuota: Number(M.cuotaOficial[mes]) || 0, venta: 0 };
    dias.forEach(function (d) {
      if (d.estado === 'cumplido') r.cumplidos++; else if (d.estado === 'no_cumplido') r.noCumplidos++; else if (d.estado === 'en_curso') { r.enCurso++; r.pendientes++; } else r.pendientes++;
      r.sumaMetas += Number(d.metaDia) || 0; r.sumaCuotas += Number(d.cuotaDia) || 0;
    });
    Object.keys(reales.ventas).forEach(function (f) { if (U.mesDe(f) === mes) r.venta += ventaDe(reales, f); });
    return r;
  }
  function htmlResumen(f, reales) {
    var meses = mesesDelCalendario();
    return '<div class="cal-resumen" id="cal-resumen">' + meses.map(function (mes) {
      var r = resumenMes(mes, reales);
      var desvio = r.sumaMetas - r.proyeccion;
      return '<div class="cal-mes-card' + (mes === f.mes ? ' activo' : '') + '" role="button" tabindex="0" data-cal="ir-mes" data-valor="' + U.attr(mes) + '" title="Ver ' + U.attr(U.nombreMes(mes)) + '">' +
        '<span class="etiqueta">' + U.esc(U.nombreMes(mes)) + ' · ' + r.dias + ' días</span>' +
        '<div class="cal-mes-dias"><span class="bien"><b>' + r.cumplidos + '</b> cumplidos</span><span class="mal"><b>' + r.noCumplidos + '</b> no cumplidos</span><span class="texto2"><b>' + r.pendientes + '</b> pendientes' + (r.enCurso ? ' (' + r.enCurso + ' en curso)' : '') + '</span></div>' +
        '<div class="cal-mes-fila"><span>Suma de metas diarias</span><span class="num">' + U.esc(U.soles(r.sumaMetas)) + (Math.abs(desvio) > 50 ? ' <small class="' + (desvio < 0 ? 'mal' : 'bien') + '">(' + (desvio > 0 ? '+' : '') + U.esc(U.soles(desvio)) + ')</small>' : '') + '</span></div>' +
        '<div class="cal-mes-fila"><span>Proyección del mes</span><span class="num">' + U.esc(U.soles(r.proyeccion)) + '</span></div>' +
        '<div class="cal-mes-fila"><span>Cuota oficial</span><span class="num">' + U.esc(U.soles(r.cuota)) + '</span></div>' +
        '<div class="cal-mes-fila venta"><span>Venta real acumulada</span><span class="num">' + U.esc(U.soles(r.venta)) + '</span></div>' +
        '<div class="cal-mes-pct">' + U.esc(U.pct(r.cuota ? r.venta / r.cuota : null, 0)) + ' de la cuota · ' + U.esc(U.pct(r.proyeccion ? r.venta / r.proyeccion : null, 0)) + ' de la proyección</div>' +
        '</div>';
    }).join('') + '</div>';
  }

  /* =========================== Gráfica SVG: meta del día vs venta real =========================== */
  function barraRedonda(x, y, w, h, clase) {
    // Barra con la punta superior redondeada (radio 4 máx.) y base recta en la línea cero
    if (h <= 0 || w <= 0) return '';
    var r = Math.min(4, w / 2, h);
    var d = 'M' + x.toFixed(1) + ' ' + (y + h).toFixed(1) + 'V' + (y + r).toFixed(1) + 'Q' + x.toFixed(1) + ' ' + y.toFixed(1) + ' ' + (x + r).toFixed(1) + ' ' + y.toFixed(1) + 'H' + (x + w - r).toFixed(1) + 'Q' + (x + w).toFixed(1) + ' ' + y.toFixed(1) + ' ' + (x + w).toFixed(1) + ' ' + (y + r).toFixed(1) + 'V' + (y + h).toFixed(1) + 'Z';
    return '<path class="' + clase + '" d="' + d + '"></path>';
  }
  function svgGrafica(mes, reales, anchoDisponible) {
    var dias = diasDelMes(mes); var hoy = U.hoyISO();
    if (!dias.length) return '<p class="texto3">Sin días de atención en este mes.</p>';
    var W = Math.max(300, Math.floor(anchoDisponible || 640)), H = 130, padI = 6, padD = 6, padS = 18, padB = 18;
    var n = dias.length, ranura = (W - padI - padD) / n;
    var max = 1;
    dias.forEach(function (d) { max = Math.max(max, Number(d.metaDia) || 0, ventaDe(reales, d.fecha)); });
    var alto = H - padS - padB, base = H - padB;
    var escala = alto / max;
    var anchoBarra = Math.max(2, Math.min(12, Math.floor((ranura - 4) / 2)));
    var cadaCuanto = ranura >= 20 ? 1 : ranura >= 12 ? 2 : 5;
    // Etiquetas del eje: una cada "cadaCuanto" barras (espaciado parejo) y la de hoy, sin vecinas que choquen
    var etiquetas = {}; var idxHoy = -1;
    dias.forEach(function (d, i) { if (i % cadaCuanto === 0) etiquetas[i] = true; if (d.fecha === hoy) idxHoy = i; });
    if (idxHoy >= 0 && cadaCuanto > 1) { etiquetas[idxHoy] = true; delete etiquetas[idxHoy - 1]; delete etiquetas[idxHoy + 1]; }
    var h = '<svg class="cal-grafica" id="cal-grafica" viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="height:' + H + 'px" role="img" aria-label="Meta del día frente a venta real en ' + U.attr(U.nombreMes(mes)) + '">';
    h += '<text x="' + padI + '" y="11">máx. ' + U.esc(U.soles(max)) + '</text>';
    h += '<line class="eje" x1="' + padI + '" y1="' + padS + '" x2="' + (W - padD) + '" y2="' + padS + '"></line>';
    dias.forEach(function (d, i) {
      var x0 = padI + i * ranura; var meta = Number(d.metaDia) || 0; var venta = ventaDe(reales, d.fecha);
      var xMeta = x0 + (ranura - anchoBarra * 2 - 2) / 2, xReal = xMeta + anchoBarra + 2;
      var hMeta = Math.round(meta * escala), hReal = Math.round(venta * escala);
      var titulo = V.DIAS[d.dow] + ' ' + U.fechaCorta(d.fecha) + ' · meta ' + U.soles(meta) + ' · venta real ' + U.soles(venta) + (d.esCorte ? ' · corte' : '');
      h += '<g class="cal-barra" data-cal="abrir" data-fecha="' + U.attr(d.fecha) + '" tabindex="-1"><title>' + U.esc(titulo) + '</title>';
      h += '<rect class="fondo' + (d.fecha === hoy ? ' hoy-fondo' : '') + '" x="' + x0.toFixed(1) + '" y="' + padS + '" width="' + ranura.toFixed(1) + '" height="' + (alto + padB) + '" fill="transparent"></rect>';
      h += barraRedonda(xMeta, base - hMeta, anchoBarra, hMeta, 'meta').replace('<path ', '<path fill="var(--cal-meta)" ');
      h += barraRedonda(xReal, base - hReal, anchoBarra, hReal, 'real').replace('<path ', '<path fill="var(--cal-real)" ');
      var num = parseInt(d.fecha.slice(8, 10), 10);
      if (etiquetas[i]) h += '<text x="' + (x0 + ranura / 2).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle"' + (d.fecha === hoy ? ' fill="var(--oro-claro)"' : '') + '>' + num + '</text>';
      h += '</g>';
    });
    h += '<line class="eje" x1="' + padI + '" y1="' + base + '" x2="' + (W - padD) + '" y2="' + base + '"></line>';
    return h + '</svg>';
  }
  function anchoGrafica() {
    var cont = UI.$('cal-grafica-caja'); var w = cont ? cont.clientWidth : 0;
    if (!w) { var p = UI.$('cal-principal'); w = (p ? p.clientWidth : 0) - 38; }
    return w > 0 ? w : 640;
  }
  function htmlGrafica(f, reales) {
    return '<div class="tarjeta cal-grafica-tarjeta"><div class="fila-sup"><h3>Meta del día vs venta real · ' + U.esc(U.nombreMes(f.mes)) + '</h3><span class="cal-leyenda"><span><i class="cal-sw meta"></i>Meta del día</span><span><i class="cal-sw real"></i>Venta real</span></span></div><div id="cal-grafica-caja">' + svgGrafica(f.mes, reales, anchoGrafica()) + '</div></div>';
  }
  function redibujarGrafica() {

  /* =========================== Navegación de meses =========================== */

      '<h3 id="cal-mes-titulo">' + U.esc(U.nombreMes(f.mes)) + '</h3>' +

  }
  function htmlLeyendaOlas() {
    return '<div class="cal-leyenda-olas">' + cfg().olas.map(function (o) { return '<span class="chip"><span class="cal-punto ola-' + U.attr(o.n) + '"></span>' + U.esc(o.nombre) + ' <small class="texto3">' + U.esc(U.fechaCorta(o.desde).slice(0, 5)) + '–' + U.esc(U.fechaCorta(o.hasta).slice(0, 5)) + '</small></span>'; }).join('') + '</div>';
  }

  /* =========================== Vista mensual =========================== */
  function celdaDia(d, fecha, hoy, reales) {
    var venta = ventaDe(reales, fecha); var contactos = contactosDe(d);
    var clases = 'cal-dia ola-' + U.attr(d.ola) + ' est-' + U.attr(d.estado) + (fecha === hoy ? ' hoy' : '') + (d.esCorte ? ' corte' : '') + (fecha === diaAbierto ? ' seleccionado' : '');

    var h = '<div class="' + clases + '" role="button" tabindex="0" data-cal="abrir" data-fecha="' + U.attr(fecha) + '" title="' + U.attr(V.DIAS[d.dow] + ' ' + U.fechaCorta(fecha) + ' · ' + nombreOla(d.ola) + (hito ? ' · ' + hito : '')) + '">';
    h += '<span class="cal-num"><span>' + parseInt(fecha.slice(8, 10), 10) + '</span>' + (d.esCorte ? '<span class="cal-corte">◆ Corte</span>' : (d.focoEditado || d.cuotasEditadas) ? '<span class="cal-editado" title="Editado a mano">✎</span>' : '') + '</span>';

    if (hito) h += '<span class="cal-hito" title="' + U.attr(hito) + '">▸ ' + U.esc(recortar(hito, 30)) + '</span>';
    if (venta > 0) h += '<span class="cal-venta" title="Venta real">▲ ' + U.esc(U.soles(venta)) + '</span>';
    h += '<span class="cal-pie"><span class="pill chica est-' + U.attr(d.estado) + '" title="' + U.attr(NOMBRE_ESTADO[d.estado] || d.estado) + '">' + U.esc(NOMBRE_ESTADO[d.estado] || d.estado) + '</span><span class="cal-contactos" title="Contactos del día">' + U.esc(U.entero(contactos)) + '<span class="cal-cont-suf"> cont.</span></span></span>';
    return h + '</div>';
  }
  function htmlGrilla(f, reales, hoy) {
    var mes = f.mes; var anio = parseInt(mes.slice(0, 4), 10), m = parseInt(mes.slice(5, 7), 10);
    var diasEnMes = new Date(anio, m, 0).getDate();
    var porFecha = {}; DB.tabla('calendario').forEach(function (d) { porFecha[d.fecha] = d; });
    var libres = (cfg().empresa.calendario && cfg().empresa.calendario.diasLibres) || [];
    var h = '<div class="tarjeta"><div class="cal-grilla" id="cal-grilla">' + CABECERA_GRILLA.map(function (c, i) { return '<div class="cal-cab' + (i === 6 ? ' dom' : '') + '">' + c + '</div>'; }).join('');
    var desplaza = (U.diaSemana(mes + '-01') + 6) % 7; // columnas vacías antes del día 1 (la grilla empieza en lunes)
    for (var i = 0; i < desplaza; i++) h += '<div class="cal-dia fuera" aria-hidden="true"></div>';
    for (var dia = 1; dia <= diasEnMes; dia++) {

      if (d) { h += celdaDia(d, fecha, hoy, reales); continue; }
      var dow = U.diaSemana(fecha); var esLibre = libres.indexOf(fecha) >= 0;

  /* =========================== Panel / modal de edición del día =========================== */

    h += '<div class="form-grid">' +

      '</div><div class="cal-cuotas-total">Total del plan para el día: <b id="cal-cuotas-total">' + U.esc(U.entero(contactosDe(d))) + '</b> contactos</div></div>';
    h += '<div class="campo"><span class="cal-etq">Notas</span><textarea name="notas" rows="2" placeholder="Qué pasó, qué quedó pendiente">' + U.esc(d.notas || '') + '</textarea></div>';

      '<div class="kpi"><span class="lab">Enviados</span><span class="val">' + U.esc(inter.length) + '</span></div>' +
      '<div class="kpi"><span class="lab">Meta del día</span><span class="val">' + U.esc(U.soles(d.metaDia)) + '</span></div></div>';
    if (ventas.length) h += '<ul class="cal-lista-real">' + ventas.slice(0, 8).map(function (v) { return '<li><b>' + U.esc(U.soles(v.total)) + '</b> · ' + U.esc(nombreContacto(v.contactoId)) + ' · ' + U.esc(v.linea === 'experiencia' ? 'experiencia' : 'botellas') + ' · ' + U.esc(v.estado) + '</li>'; }).join('') + (ventas.length > 8 ? '<li class="texto3">y ' + (ventas.length - 8) + ' más</li>' : '') + '</ul>';
    if (inter.length) h += '<ul class="cal-lista-real">' + inter.slice(0, 8).map(function (i) { return '<li>' + U.esc(String(i.fecha || '').slice(11, 16) || '—') + ' · ' + U.esc(nombreContacto(i.contactoId)) + ' · ' + U.esc(i.canal || '') + (i.toque !== '' && i.toque != null ? ' · toque ' + U.esc(i.toque) : '') + ' · ' + U.esc(i.resultado || '') + '</li>'; }).join('') + (inter.length > 8 ? '<li class="texto3">y ' + (inter.length - 8) + ' más</li>' : '') + '</ul>';

    h += '</div><p class="cal-aviso">La meta y la cuota del día editadas a mano se vuelven a repartir al "Recalcular desde metas"; el foco y los contactos por segmento editados sí se conservan.</p>';

  function enlazarFormDia(contenedor, enModal) {
    var form = UI.qs('#formCalDia', contenedor); if (!form) return;
    form.onsubmit = function (ev) { ev.preventDefault(); guardarDia(form, enModal); };
    UI.qsa('[data-plan]', form).forEach(function (b) { b.onclick = function () { cargarPlan(form, b.getAttribute('data-plan')); }; });
    var cerrar = UI.qs('[data-cerrar-dia]', form); if (cerrar) cerrar.onclick = function () { if (enModal) UI.cerrarModal(); else cerrarPanel(); };
    form.addEventListener('input', function (ev) {
      if (/^cuota_/.test(ev.target.name || '')) { var t = 0; UI.qsa('[name^="cuota_"]', form).forEach(function (i) { t += Math.max(0, Math.round(Number(i.value) || 0)); }); var tot = UI.qs('#cal-cuotas-total', form); if (tot) tot.textContent = U.entero(t); }
    });
  }
  function cargarPlan(form, que) {
    var plan = diaDelPlan(form.getAttribute('data-fecha'));
    if (!plan) { UI.toast('No se pudo recalcular ese día desde el plan', 'alerta'); return; }
    if (que === 'foco') { form.elements.foco.value = plan.foco || ''; form.elements.foco.focus(); UI.toast('Foco del plan cargado · pulse Guardar para aplicarlo'); }
    else {
      cfg().segmentos.forEach(function (s) { var el = form.elements['cuota_' + s.codigo]; if (el) el.value = Number((plan.cuotas || {})[s.codigo]) || 0; });
      var tot = UI.qs('#cal-cuotas-total', form); if (tot) tot.textContent = U.entero(contactosDe(plan));
      UI.toast('Cuotas del plan cargadas · pulse Guardar para aplicarlas');
    }
  }
  function guardarDia(form, enModal) {
    var fecha = form.getAttribute('data-fecha'); var d = R.diaCalendario(fecha);
    if (!d) { UI.toast('Ese día ya no existe en el calendario', 'alerta'); return; }
    var v = UI.leerForm(form);
    var meta = Number(v.metaDia), cuota = Number(v.cuotaDia);
    if (v.metaDia === '' || isNaN(meta) || meta < 0 || v.cuotaDia === '' || isNaN(cuota) || cuota < 0) { UI.toast('Escriba montos válidos (0 o más) en meta y cuota del día', 'alerta'); return; }
    var nuevo = U.clonar(d);
    nuevo.foco = String(v.foco || '').trim(); nuevo.hito = String(v.hito || '').trim(); nuevo.periodo = String(v.periodo || '').trim(); nuevo.notas = String(v.notas || '').trim();
    nuevo.metaDia = Math.round(meta); nuevo.cuotaDia = Math.round(cuota);
    nuevo.estado = NOMBRE_ESTADO[v.estado] ? v.estado : (d.estado || 'pendiente');
    var cuotas = U.clonar(d.cuotas || {});
    cfg().segmentos.forEach(function (s) { var n = Number(v['cuota_' + s.codigo]); cuotas[s.codigo] = isNaN(n) || n < 0 ? 0 : Math.round(n); });
    nuevo.cuotas = cuotas;
    var plan = diaDelPlan(fecha);
    // "Editado" significa distinto del plan: así sobrevive al recálculo solo lo que de verdad cambió
    nuevo.focoEditado = plan ? nuevo.foco !== String(plan.foco || '').trim() : (nuevo.foco !== String(d.foco || '').trim() || !!d.focoEditado);
    nuevo.cuotasEditadas = plan ? !mismasCuotas(nuevo.cuotas, plan.cuotas) : (!mismasCuotas(nuevo.cuotas, d.cuotas) || !!d.cuotasEditadas);
    DB.upsert('calendario', nuevo);
    UI.toast('Día guardado · ' + U.fechaCorta(fecha));
    if (enModal) { UI.cerrarModal(); diaAbierto = ''; render(); }
    else { renderPrincipal(); renderPanel(true); }
  }
  function abrirDia(fecha) {
    if (!R.diaCalendario(fecha)) return;
    diaAbierto = fecha;
    if (esMovil()) {
      UI.abrirModal(htmlFormDia(fecha), { ancho: 'ancho', sinFoco: true });
      enlazarFormDia(UI.$('modalContenido'), true);
    } else {
      renderPanel(true);
      marcarSeleccion();
    }
  }
  function cerrarPanel() {
    diaAbierto = '';
    var panel = UI.$('cal-panel'); if (panel) { panel.hidden = true; panel.innerHTML = ''; }
    var layout = UI.$('cal-layout'); if (layout) layout.classList.remove('con-panel');
    marcarSeleccion();
    redibujarGrafica();
  }
  // Redibuja el panel lateral; si el usuario está escribiendo dentro y no se fuerza, lo deja como está
  function renderPanel(forzar) {
    var panel = UI.$('cal-panel'), layout = UI.$('cal-layout'); if (!panel || !layout) return;
    if (!diaAbierto || esMovil() || !R.diaCalendario(diaAbierto)) {
      if (!esMovil() || !diaAbierto) diaAbierto = esMovil() ? diaAbierto : '';
      panel.hidden = true; panel.innerHTML = ''; layout.classList.remove('con-panel'); return;
    }
    if (!forzar && panel.contains(document.activeElement) && document.activeElement !== document.body) return;
    panel.innerHTML = htmlFormDia(diaAbierto); panel.hidden = false;
    var abiertoAntes = layout.classList.contains('con-panel');
    layout.classList.add('con-panel');
    enlazarFormDia(panel, false);
    if (!abiertoAntes) redibujarGrafica();
  }
  function marcarSeleccion() {
    UI.qsa('.cal-dia[data-fecha]', UI.$('p-calendario')).forEach(function (c) { c.classList.toggle('seleccionado', c.getAttribute('data-fecha') === diaAbierto); });
  }

  /* =========================== Exportar CSV =========================== */
  function exportarCSV() {
    var reales = datosReales(); var segs = cfg().segmentos;
    var filas = DB.tabla('calendario').slice().sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; }).map(function (d) {
      var o = { fecha: U.fechaCorta(d.fecha), dia: V.DIAS[d.dow], ola: d.ola, foco: d.foco || '', hito: d.hito || '', periodo: d.periodo || '', metaDia: d.metaDia, cuotaDia: d.cuotaDia };
      segs.forEach(function (s) { o['contactos_' + s.codigo] = Number((d.cuotas || {})[s.codigo]) || 0; });
      o.contactosTotal = contactosDe(d); o.estado = d.estado; o.notas = d.notas || ''; o.esCorte = d.esCorte ? 'sí' : '';
      o.focoEditado = d.focoEditado ? 'sí' : ''; o.cuotasEditadas = d.cuotasEditadas ? 'sí' : '';
      o.ventaReal = ventaDe(reales, d.fecha); o.enviados = enviadosDe(reales, d.fecha);
      return o;
    });
    if (!filas.length) { UI.toast('No hay días que exportar', 'alerta'); return; }
    U.descargar('calendario-' + U.hoyISO() + '.csv', U.aCSV(filas, Object.keys(filas[0])), 'text/csv;charset=utf-8');
    UI.toast('CSV del calendario descargado');
  }

  /* =========================== Eventos (delegación en la sección) =========================== */
  function cambiarMes(delta) {
    var f = estadoUI(); var meses = mesesDelCalendario(); var i = meses.indexOf(f.mes) + delta;
    if (i < 0 || i >= meses.length) return;
    f.mes = meses[i]; DB.guardarPronto(); renderPrincipal();
  }
  function irAHoy() {
    var f = estadoUI(); var hoy = U.hoyISO();
    f.mes = mesMasCercano(mesesDelCalendario(), U.mesDe(hoy)); DB.guardarPronto(); renderPrincipal();
    var celda = UI.qs('.cal-dia.hoy[data-fecha]', UI.$('p-calendario'));
    if (celda && celda.scrollIntoView) celda.scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (!celda && !R.diaCalendario(hoy)) UI.toast('Hoy no es un día de atención del calendario');
  }
  function alClic(ev) {
    var recalc = ev.target.closest('[data-accion="recalcular-calendario"]');
    if (recalc) { setTimeout(render, 0); return; } // el núcleo recalcula en su propio manejador; aquí solo se redibuja después
    var el = ev.target.closest('[data-cal]'); if (!el) return;
    var que = el.getAttribute('data-cal'); var f = estadoUI();
    switch (que) {
      case 'vista': f.vista = el.getAttribute('data-valor') === 'lista' ? 'lista' : 'mes'; DB.guardarPronto(); renderPrincipal(); break;
      case 'mes-ant': cambiarMes(-1); break;
      case 'mes-sig': cambiarMes(1); break;
      case 'hoy': irAHoy(); break;
      case 'ir-mes': f.mes = mesMasCercano(mesesDelCalendario(), el.getAttribute('data-valor')); DB.guardarPronto(); renderPrincipal(); break;
      case 'abrir': abrirDia(el.getAttribute('data-fecha')); break;
    }
  }
  function alTecla(ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var el = ev.target.closest('[role="button"][data-cal]'); if (!el || el.tagName === 'BUTTON') return;
    ev.preventDefault(); alClic({ target: el });
  }
  function alCambio(ev) {
    var el = ev.target;
    if (el.closest('.cal-filtros') && el.name) { var f = estadoUI(); f[el.name] = el.value; DB.guardarPronto(); redibujarLista(); return; }
    if (el.classList.contains('cal-estado-sel')) {
      var d = R.diaCalendario(el.getAttribute('data-fecha')); if (!d || !NOMBRE_ESTADO[el.value]) return;
      d.estado = el.value; DB.upsert('calendario', d);
      el.className = 'cal-estado-sel est-' + el.value;
      var res = UI.$('cal-resumen'); if (res) res.outerHTML = htmlResumen(estadoUI(), datosReales());
      if (diaAbierto === d.fecha) renderPanel(true);
      UI.toast('Estado guardado · ' + U.fechaCorta(d.fecha));
    }
  }
  function enlazarUnaVez(raiz) {
    if (raiz.getAttribute('data-cal-enlazado')) return;
    raiz.setAttribute('data-cal-enlazado', '1');
    raiz.addEventListener('click', alClic);
    raiz.addEventListener('keydown', alTecla);
    raiz.addEventListener('change', alCambio);
    window.addEventListener('resize', function () {
      clearTimeout(timerResize);
      timerResize = setTimeout(function () {
        if (UI.$('p-calendario').hidden || !UI.$('cal-principal')) return;
        if (esMovil() && diaAbierto && UI.$('modal').hidden) { diaAbierto = ''; renderPanel(true); marcarSeleccion(); }
        redibujarGrafica();
      }, 150);
    });
  }

  V.registrarPantalla('calendario', render);
  V.registrarAccion('cal-exportar', exportarCSV);
})();

</script>
<script>
/* ---- módulo: hoy.js ---- */
/* ============================================================================
   hoy.js · Pantalla HOY (parte 2) · Bodegas Viñas de Oro / The Pisco Room
   Cola del día con mensajes ya armados: copiar y abrir WhatsApp o correo,
   marcar enviado / respondió / compró, posponer, dormir, perdido, cuentas,
   KPIs del día, cuotas por segmento, cierre del día y próximos 7 días.
   El CRM no envía nada: arma el texto, lo copia y abre wa.me o mailto.
   ========================================================================== */
(function () {
  'use strict';
  var V = window.VDO, U = V.util, UI = V.ui, R = V.reglas, E = V.embudo, DB = V.DB, cfg = V.cfg;

  // Secciones de la cola, en el orden en que se pintan
  var SECCIONES = [
    { id: 'vencidos', titulo: 'Vencidos', tipos: null },
    { id: 'responder', titulo: 'Responder y cerrar', tipos: ['responder', 'cobro', 'entrega'] },
    { id: 'seguimientos', titulo: 'Seguimientos', tipos: ['seguimiento', 'cerrar_conversacion'] },
    { id: 'postventa', titulo: 'Post-venta', tipos: ['postventa'] },
    { id: 'cuentas', titulo: 'Cuentas y eventos', tipos: ['cuenta'] },
    { id: 'nuevos', titulo: 'Nuevos toques', tipos: ['inicial'] }
  ];
  // Tarjetas visibles por sección antes de "Ver más" (nuevos: por segmento)
  var LIMITES = { vencidos: 20, responder: 40, seguimientos: 30, postventa: 30, cuentas: 30, nuevos: 10 };
  var PASO_VER_MAS = 20;
  // Variables de plantilla que el usuario puede completar desde la tarjeta
  var VARIABLES = [
    { campo: 'ocasion', etiqueta: 'Ocasión', placeholder: 'cumpleaños, regalo, evento…' },
    { campo: 'empresa', etiqueta: 'Empresa', placeholder: 'nombre de la empresa' },
    { campo: 'personas', etiqueta: 'Personas', placeholder: '0', tipo: 'number' },
    { campo: 'ciudad', etiqueta: 'Ciudad', placeholder: 'Lima' }
  ];
  var ETIQUETA_ESTADO = { pendiente: 'Pendiente', en_curso: 'En curso', cumplido: 'Cumplido', no_cumplido: 'No cumplido' };
  var ETIQUETA_TIPO = { hito: 'Hito', corte: 'Corte', alerta: 'Fecha clave', periodo: 'Periodo' };

  // Estado de la pantalla (no se persiste): items de la cola por clave, límites de "ver más"
  var estado = { items: {}, limites: {}, enlazado: false };

  /* =========================== Utilidades =========================== */
  function horaAhora() { return U.ahoraISO().slice(11, 16); }
  function claveDe(item) { return item.tipo === 'cuenta' ? 'k:' + item.cuenta.id : 'c:' + (item.contacto ? item.contacto.id : ''); }
  function raiz() { return UI.$('p-hoy'); }
  function tarjetaPorClave(clave) { return UI.qsa('.hoy-card', raiz()).filter(function (el) { return el.getAttribute('data-clave') === clave; })[0] || null; }
  function etiquetaEstado(e) { return ETIQUETA_ESTADO[e] || (e || 'Pendiente'); }
  function clasePill(e) { return e === 'cumplido' ? ' ok' : e === 'no_cumplido' ? ' alerta' : ''; }

  // Resumen del día del núcleo, con "enviados" = interacciones de hoy que tienen toque
  // (el núcleo cuenta también un "compró" sin toque; eso no es un envío)
  function resumenHoy(fecha) {
    var r = E.resumenDia(fecha);
    r.enviados = DB.tabla('interacciones').filter(function (i) { return String(i.fecha || '').slice(0, 10) === fecha && String(i.toque == null ? '' : i.toque) !== ''; }).length;
    return r;
  }
  // Enviados de hoy con toque 1, por segmento del contacto
  function enviadosPorSegmento(fecha) {
    var porId = {}; DB.tabla('contactos').forEach(function (c) { porId[c.id] = c; });
    var m = {};
    DB.tabla('interacciones').forEach(function (i) {
      if (String(i.fecha || '').slice(0, 10) !== fecha || String(i.toque) !== '1') return;
      var c = porId[i.contactoId]; var seg = c ? (c.segmento || '') : '';
      m[seg] = (m[seg] || 0) + 1;
    });
    return m;
  }
  function ultimaVentaDe(contactoId) {
    return DB.tabla('ventas').filter(function (v) { return v.contactoId === contactoId && v.estado !== 'perdido'; })
      .sort(function (a, b) { return String(b.fecha || '') > String(a.fecha || '') ? 1 : String(b.fecha || '') < String(a.fecha || '') ? -1 : 0; })[0] || null;
  }
  // Barra de progreso: relleno dorado sobre pista del mismo tono; verde al llegar a la meta
  function barra(valor, meta) {
    var p = meta > 0 ? Math.min(1, valor / meta) : (valor > 0 ? 1 : 0);
    var ok = meta > 0 && valor >= meta;
    return '<div class="hoy-barra' + (ok ? ' ok' : '') + '" role="progressbar" aria-valuenow="' + Math.round(p * 100) + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + (p * 100).toFixed(1) + '%"></i></div>';
  }

  /* =========================== Mensajes =========================== */
  function plantillasDe(c) { return DB.tabla('plantillas').filter(function (p) { return p.activa !== false && (p.segmento === c.segmento || p.segmento === '*'); }); }
  function opcionesPlantillas(lista, sel) {
    var h = '<option value=""' + (!sel ? ' selected' : '') + '>— sin plantilla (mensaje libre) —</option>';
    lista.forEach(function (p) { h += '<option value="' + U.attr(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + U.esc(p.nombre) + (p.canal === 'correo' ? ' · correo' : '') + (p.masivo ? ' · con leyendas' : '') + '</option>'; });
    return h;
  }
  // Canal del botón principal: correo si la plantilla es de correo o no hay teléfono
  function canalDe(c, pl) { return (pl && pl.canal === 'correo') || !c.telefono ? 'correo' : 'whatsapp'; }
  function urlDe(c, canal, texto, asunto) { return canal === 'correo' ? R.urlCorreo(c.correo || '', asunto || '', texto || '') : R.urlWhatsApp(c.telefono, texto || ''); }
  // Variables extra para propuesta, cobro, entrega y post-venta: producto y total de la última venta
  function extraDe(item, c) {
    var extra = {}; var v = ultimaVentaDe(c.id);
    if (v) {
      var prod = (v.items || []).map(function (i) { return ((Number(i.cantidad) || 0) > 1 ? i.cantidad + ' × ' : '') + (i.nombre || ''); }).filter(Boolean).join(', ');
      if (prod) extra.producto = prod;
      if (Number(v.total) > 0) extra.total = U.soles(v.total).replace('S/ ', '');
      if (item.tipo === 'entrega' && v.fechaEntrega) extra.ocasion = 'el ' + U.fechaCorta(v.fechaEntrega);
    }
    if (!extra.producto) extra.producto = item.tipo === 'postventa' ? 'su pedido' : '[PRODUCTO Y CANTIDAD]';
    if (!extra.total) extra.total = '[TOTAL]';
    return extra;
  }
  function mensajeDe(item, pl, c) {
    if (!pl) return { texto: '', asunto: '' };
    try { return R.armarMensaje(pl, c, extraDe(item, c)); } catch (e) { return { texto: '', asunto: '' }; }
  }
  function variablesUsadas(pl) {
    if (!pl) return [];
    var usadas = {};
    String((pl.texto || '') + ' ' + (pl.asunto || '')).replace(/\{(\w+)\}/g, function (m, k) { usadas[k] = true; return m; });
    return VARIABLES.filter(function (v) { return usadas[v.campo]; });
  }
  function faltaVariable(c, campo) {
    if (campo === 'empresa') return !c.empresa && !c.subsegmento;
    var v = c[campo]; return v == null || v === '' || v === 0;
  }
  function variablesHtml(c, pl) {
    var faltan = variablesUsadas(pl).filter(function (v) { return faltaVariable(c, v.campo); });
    if (!faltan.length) return '';
    return '<div class="hoy-vars">' + faltan.map(function (v) {
      return '<label class="campo"><span>' + U.esc(v.etiqueta) + ' <small>falta en la ficha</small></span><input data-var="' + U.attr(v.campo) + '" type="' + (v.tipo || 'text') + '" placeholder="' + U.attr(v.placeholder) + '" value="" autocomplete="off"></label>';
    }).join('') + '</div>';
  }

  /* =========================== Textos de la tarjeta =========================== */
  function toqueTexto(item, c) {
    var max = cfg().reglas.maxToques;
    if (item.tipo === 'inicial' || item.tipo === 'seguimiento') return 'toque ' + item.toque + ' de ' + max;
    if (item.tipo === 'cerrar_conversacion') return 'toque ' + (Number(c.toques) || max) + ' de ' + max;
    return Number(c.toques) ? 'toque ' + c.toques + ' de ' + max : '';
  }
  function motivoDe(item, c, hoy) {
    var m;
    switch (item.tipo) {
      case 'inicial': m = (c.estado === 'dormido' ? 'Vuelve de dormido · ' : '') + 'Nuevo toque de la ola ' + R.olaDe(hoy); break;
      case 'seguimiento': m = 'Sin respuesta al toque ' + (Number(c.toques) || 1) + ' · toca el ' + item.toque; break;
      case 'cerrar_conversacion': m = 'Sin respuesta tras el último toque · cerrar la conversación'; break;
      case 'responder': m = 'Respondió · armar la propuesta con total y link de pago'; break;
      case 'cobro': m = 'Propuesta enviada · recordar el pago'; break;
      case 'entrega': { var v = ultimaVentaDe(c.id); m = 'Pago confirmado · coordinar la entrega' + (v && v.fechaEntrega ? ' del ' + U.fechaCorta(v.fechaEntrega) : ''); break; }
      case 'postventa': m = 'Post-venta · agradecer, pedir foto y dar el código ' + (c.codigoReferido || 'de referido'); break;
      default: m = item.tipo;
    }
    if (item.vencido) m = 'Vencido desde el ' + U.fechaCorta(c.proximoToque) + ' · ' + m;
    return m;
  }

  /* =========================== Tarjetas =========================== */
  function tarjetaHtml(item, hoy) {
    if (item.tipo === 'cuenta') return tarjetaCuentaHtml(item);
    var c = item.contacto, pl = item.plantilla || null, clave = claveDe(item);
    var canal = canalDe(c, pl), msg = mensajeDe(item, pl, c), toque = toqueTexto(item, c);
    var cierre = item.tipo === 'cerrar_conversacion';
    var h = '<article class="hoy-card' + (item.vencido ? ' vencida' : '') + (cierre ? ' cierre' : '') + '" data-clave="' + U.attr(clave) + '" data-id="' + U.attr(c.id) + '" data-tipo="' + U.attr(item.tipo) + '" data-plantilla="' + U.attr(pl ? pl.id : '') + '">' +
      '<div class="hoy-card-cab"><b class="hoy-nombre">' + U.esc(c.nombre || '(sin nombre)') + '</b><span class="chip seg-' + U.esc(c.segmento || '') + '">' + U.esc(R.nombreSegmento(c.segmento)) + '</span><span class="pill chica">' + U.esc(R.nombreEtapa(c.etapa)) + '</span>' +
      (toque ? '<span class="pill chica">' + U.esc(toque) + '</span>' : '') + (c.perfil ? '<span class="pill chica">perfil ' + U.esc(c.perfil) + '</span>' : '') + (c.prueba ? '<span class="pill chica">prueba</span>' : '') + '</div>' +
      '<div class="texto3 hoy-card-datos">' + U.esc(c.telefono || 'sin teléfono') + (c.correo ? ' · ' + U.esc(c.correo) : '') + (c.empresa ? ' · ' + U.esc(c.empresa) : '') + (c.cargo ? ' · ' + U.esc(c.cargo) : '') + (c.ciudad ? ' · ' + U.esc(c.ciudad) : '') + '</div>' +
      '<div class="hoy-motivo' + (item.vencido ? ' mal' : '') + '">' + U.esc(motivoDe(item, c, hoy)) + '</div>';
    if (cierre) {
      h += '<p class="texto2">Ya recibió sus ' + U.esc(cfg().reglas.maxToques) + ' toques sin responder. Duerma la conversación (vuelve en la siguiente ola) o márquela como perdida.</p>';
    } else {
      h += '<div class="hoy-plantilla"><select data-campo="plantilla" aria-label="Plantilla">' + opcionesPlantillas(plantillasDe(c), pl ? pl.id : '') + '</select></div>' + variablesHtml(c, pl);
      if (canal === 'correo') h += '<input data-campo="asunto" value="' + U.attr(msg.asunto) + '" placeholder="Asunto del correo" aria-label="Asunto">';
      h += '<textarea data-campo="mensaje" rows="5" aria-label="Mensaje" placeholder="Escriba el mensaje…">' + U.esc(msg.texto) + '</textarea>';
    }
    h += '<div class="acciones hoy-acciones">';
    if (!cierre) h += '<a class="btn primario" data-accion-hoy="abrir" target="_blank" rel="noopener" href="' + U.attr(urlDe(c, canal, msg.texto, msg.asunto)) + '">' + (canal === 'correo' ? 'Copiar y abrir correo' : 'Copiar y abrir WhatsApp') + '</a><button type="button" class="btn" data-accion-hoy="enviado">Marcar enviado</button>';
    h += '<button type="button" class="btn" data-accion-hoy="respondio">Respondió</button>' +
      '<button type="button" class="btn" data-accion-hoy="venta">' + (item.tipo === 'postventa' ? 'Recompra / Registrar venta' : 'Compró / Registrar venta') + '</button>' +
      '<span class="hoy-mas"><button type="button" class="btn chico" data-accion-hoy="posponer" data-dias="1">+1 día</button><button type="button" class="btn chico" data-accion-hoy="posponer" data-dias="2">+2 días</button>' +
      '<button type="button" class="btn chico' + (cierre ? ' primario' : '') + '" data-accion-hoy="dormir">Dormir</button><button type="button" class="btn chico peligro" data-accion-hoy="perdido">Perdido</button><button type="button" class="btn chico" data-accion-hoy="ficha">Ficha</button></span></div>' +
      '<div class="hoy-inline" hidden></div></article>';
    return h;
  }
  function tarjetaCuentaHtml(item) {
    var k = item.cuenta, c = item.contacto;
    return '<article class="hoy-card hoy-card-cuenta' + (item.vencido ? ' vencida' : '') + '" data-clave="' + U.attr(claveDe(item)) + '" data-id="' + U.attr(k.id) + '" data-tipo="cuenta">' +
      '<div class="hoy-card-cab"><b class="hoy-nombre">' + U.esc(k.empresa || '(cuenta sin nombre)') + '</b><span class="chip seg-' + U.esc(k.segmento || '') + '">' + U.esc(R.nombreSegmento(k.segmento)) + '</span><span class="pill chica">' + U.esc(k.estado || 'contactado') + '</span>' + (k.prueba ? '<span class="pill chica">prueba</span>' : '') + '</div>' +
      '<div class="texto3 hoy-card-datos">' + (c ? U.esc(c.nombre) + (c.telefono ? ' · ' + U.esc(c.telefono) : '') : 'Sin contacto asociado') + (k.personas ? ' · ' + U.esc(k.personas) + ' personas' : '') + (k.fechaEvento ? ' · evento ' + U.esc(U.fechaCorta(k.fechaEvento)) : '') + (Number(k.monto) ? ' · ' + U.soles(k.monto) : '') + '</div>' +
      '<div class="hoy-motivo' + (item.vencido ? ' mal' : '') + '">' + (item.vencido ? 'Vencido desde el ' + U.esc(U.fechaCorta(k.fechaProximoPaso)) + ' · ' : '') + 'Próximo paso: <b>' + U.esc(k.proximoPaso || '(sin detalle)') + '</b> · ' + U.esc(U.fechaCorta(k.fechaProximoPaso)) + '</div>' +
      '<div class="acciones hoy-acciones"><button type="button" class="btn primario" data-accion-hoy="hecho">Hecho</button><button type="button" class="btn" data-accion-hoy="ver-cuenta">Ver cuenta</button>' +
      (c && c.telefono ? '<a class="btn" target="_blank" rel="noopener" href="' + U.attr(R.urlWhatsApp(c.telefono)) + '">WhatsApp</a>' : '') + '</div><div class="hoy-inline" hidden></div></article>';
  }

  /* =========================== Bloques de la pantalla =========================== */
  function cabeceraHtml(hoy, dia) {
    var ola = dia ? dia.ola : R.olaDe(hoy);
    var olaInfo = cfg().olas.filter(function (o) { return o.n === ola; })[0];
    var nombreOla = olaInfo ? olaInfo.nombre : 'Ola ' + ola;
    var h = '<div class="cabecera-pantalla"><h2>Hoy</h2><p class="sub">' + U.esc(U.fechaLarga(hoy)) + ' · ' + U.esc(horaAhora()) + ', hora de Lima</p>' + (dia && dia.esCorte ? '<span class="pill alerta">Corte de control</span>' : '') + '</div>';
    if (dia) {
      h += '<div class="tarjeta oro hoy-dia"><div class="fila-sup"><span class="etiqueta">' + U.esc(nombreOla) + '</span>' + (dia.esCorte ? '<span class="pill alerta">Corte de control</span>' : '') + '<span class="pill' + clasePill(dia.estado) + '">Día ' + U.esc(etiquetaEstado(dia.estado).toLowerCase()) + '</span></div>' +
        '<h3>Foco del día</h3><p>' + U.esc(dia.foco || '—') + '</p>' + (dia.hito ? '<p><b>Hito:</b> ' + U.esc(dia.hito) + '</p>' : '') + (dia.periodo ? '<p class="texto2">Periodo: ' + U.esc(dia.periodo) + '</p>' : '') + '</div>';
    } else {
      h += '<div class="tarjeta hoy-dia"><div class="fila-sup"><span class="etiqueta">' + U.esc(nombreOla) + '</span></div><p><b>Hoy no es día de atención</b> del calendario (domingo, 25/12 o fuera del 07/10 al 31/12). Igual le mostramos los vencidos y pendientes para que nada se pierda.</p></div>';
    }
    return h;
  }
  function kpiHtml(etiqueta, valor, sub, actual, meta) {
    return '<div class="kpi hoy-kpi' + (meta != null && meta > 0 && actual < meta * 0.5 ? ' flojo' : '') + '"><span class="lab">' + U.esc(etiqueta) + '</span><span class="val">' + valor + '</span>' + (sub ? '<span class="hoy-sub">' + U.esc(sub) + '</span>' : '') + (meta != null ? barra(actual, meta) : '') + '</div>';
  }
  function resumenHtml(hoy, dia) {
    var r = resumenHoy(hoy);
    var h = '<div class="tarjeta"><h3>Avance del día</h3><div class="kpis hoy-kpis">' +
      kpiHtml('Enviados hoy', U.entero(r.enviados) + ' <small>/ ' + U.entero(r.cuotaContactos) + '</small>', 'cuota de contactos del día', r.enviados, r.cuotaContactos) +
      kpiHtml('Venta del día', U.soles(r.ventaDia), 'meta del día ' + U.soles(r.metaDia) + ' (proyección)', r.ventaDia, r.metaDia) +
      kpiHtml('Vs. cuota oficial', U.pct(r.cuotaDia ? r.ventaDia / r.cuotaDia : null, 0), 'cuota oficial del día ' + U.soles(r.cuotaDia), r.ventaDia, r.cuotaDia) +
      kpiHtml('Respondieron', U.entero(r.respondieron), r.enviados ? U.pct(r.respondieron / r.enviados, 0) + ' de los enviados' : 'de los enviados de hoy', null) +
      kpiHtml('Compraron', U.entero(r.compraron), 'ventas pagadas o entregadas hoy', null) + '</div>';
    var env = enviadosPorSegmento(hoy);
    var segs = cfg().segmentos.filter(function (s) { return (dia && Number(dia.cuotas[s.codigo]) > 0) || env[s.codigo]; });
    h += '<h4>Cuotas por segmento · enviados hoy con toque 1</h4>';
    if (!segs.length) h += '<p class="texto3">Hoy no hay cuotas de contactos.</p>';
    else h += '<div class="hoy-cuotas">' + segs.map(function (s) {
      var cuota = dia ? Number(dia.cuotas[s.codigo]) || 0 : 0, n = env[s.codigo] || 0;
      return '<div class="hoy-cuota" data-seg="' + U.attr(s.codigo) + '"><div class="hoy-cuota-fila"><span class="chip seg-' + U.esc(s.codigo) + '">' + U.esc(s.nombre) + '</span><span class="num">' + U.entero(n) + ' / ' + U.entero(cuota) + '</span></div>' + barra(n, cuota) + '</div>';
    }).join('') + '</div>';
    return h + '</div>';
  }
  function listaHtml(items, claveLimite, hoy) {
    var lim = estado.limites[claveLimite] || LIMITES[claveLimite.split(':')[0]] || 20;
    var h = '<div class="hoy-lista">' + items.slice(0, lim).map(function (it) { return tarjetaHtml(it, hoy); }).join('') + '</div>';
    if (items.length > lim) h += '<div class="acciones"><button type="button" class="btn chico" data-accion-hoy="ver-mas" data-limite="' + U.attr(claveLimite) + '">Ver ' + Math.min(PASO_VER_MAS, items.length - lim) + ' más · ' + (items.length - lim) + ' sin mostrar</button></div>';
    return h;
  }
  function gruposInicialHtml(items, hoy, dia) {
    var env = enviadosPorSegmento(hoy); var porSeg = {};
    items.forEach(function (it) { var s = it.contacto.segmento || ''; (porSeg[s] = porSeg[s] || []).push(it); });
    var orden = cfg().segmentos.map(function (s) { return s.codigo; });
    Object.keys(porSeg).forEach(function (k) { if (orden.indexOf(k) < 0) orden.push(k); });
    return orden.filter(function (seg) { return porSeg[seg]; }).map(function (seg) {
      var cuota = dia ? Number(dia.cuotas[seg]) || 0 : 0, n = env[seg] || 0;

    }).join('');
  }
  function colaHtml(cola, hoy, dia) {
    if (!cola.length) return '<div class="tarjeta hoy-cola-tarjeta"><div class="fila-sup"><h3>Cola del día</h3><span class="hoy-cont" data-total>0</span></div><p class="texto2">Nada pendiente por ahora. Los nuevos toques salen de los contactos sin próximo toque que cumplen las reglas de recontacto; importe más contactos o revise el pipeline.</p></div>';
    var h = '<div class="tarjeta hoy-cola-tarjeta"><div class="fila-sup"><h3>Cola del día</h3><span class="hoy-cont" data-total>' + cola.length + '</span></div>';
    SECCIONES.forEach(function (s) {
      var items = cola.filter(function (it) { return s.id === 'vencidos' ? it.vencido : (!it.vencido && s.tipos.indexOf(it.tipo) >= 0); });
      if (!items.length) return;
      h += '<section class="hoy-seccion" data-seccion="' + s.id + '"><h3 class="hoy-seccion-titulo">' + U.esc(s.titulo) + ' <span class="hoy-cont" data-contador>' + items.length + '</span></h3>' +
        (s.id === 'nuevos' ? gruposInicialHtml(items, hoy, dia) : listaHtml(items, s.id, hoy)) + '</section>';
    });
    return h + '</div>';
  }
  // Enviados hoy que aún no responden: para marcar respuestas o compras que llegan durante el día
  function enviadosHoyHtml(hoy) {

  function alertaCorteHtml(hoy) {

  function proximosHtml(hoy) {

  /* =========================== Render =========================== */
  function render() {
    var r = raiz(); if (!r) return;

    var hoy = U.hoyISO(); var dia = R.diaCalendario(hoy); var cola = E.colaDelDia(hoy);
    estado.items = {}; cola.forEach(function (it) { estado.items[claveDe(it)] = it; });
    r.innerHTML = cabeceraHtml(hoy, dia) +
      '<div id="hoy-resumen">' + resumenHtml(hoy, dia) + '</div>' +
      '<div id="hoy-cola">' + colaHtml(cola, hoy, dia) + '</div>' +
      '<div id="hoy-enviados">' + enviadosHoyHtml(hoy) + '</div>' +
      '<div class="grid-2 hoy-abajo"><div class="tarjeta hoy-pie" id="hoy-pie">' + pieHtml(hoy, dia, cola) + '</div><div class="tarjeta" id="hoy-proximos">' + proximosHtml(hoy) + '</div></div>';

  // Lo escrito en las tarjetas (mensaje editado, plantilla elegida, formulario abierto) sobrevive a un re-render
  function capturarBorradores(r) {
    var m = {};
    UI.qsa('.hoy-card', r).forEach(function (card) {
      var ta = UI.qs('[data-campo="mensaje"]', card), sel = UI.qs('[data-campo="plantilla"]', card), as = UI.qs('[data-campo="asunto"]', card), inline = UI.qs('.hoy-inline', card);
      var b = { editado: card.getAttribute('data-editado') === '1', abierta: card.classList.contains('abierta'), plantilla: sel ? sel.value : null, mensaje: ta ? ta.value : null, asunto: as ? as.value : null,
        inlineModo: inline && !inline.hidden ? inline.getAttribute('data-modo') : '', inlineTexto: '', inlineFecha: '' };
      if (b.inlineModo) { var t = UI.qs('[data-inline="texto"]', inline), f = UI.qs('[data-inline="fecha"]', inline); b.inlineTexto = t ? t.value : ''; b.inlineFecha = f ? f.value : ''; }
      // la plantilla cuenta como borrador solo si el usuario la cambió respecto a la que se pintó
      if (b.editado || b.abierta || b.inlineModo || (sel && b.plantilla !== (card.getAttribute('data-plantilla') || ''))) m[card.getAttribute('data-clave')] = b;
    });
    return m;
  }
  function aplicarBorradores(r, borradores, hoy) {
    Object.keys(borradores).forEach(function (clave) {
      var b = borradores[clave]; var item = estado.items[clave]; var card = tarjetaPorClave(clave); if (!item || !card) return;
      var sel = UI.qs('[data-campo="plantilla"]', card);
      if (sel && b.plantilla != null && b.plantilla !== sel.value) { item.plantilla = b.plantilla ? DB.buscar('plantillas', b.plantilla) : null; card = reemplazarTarjeta(card, item, hoy); }
      if (b.editado) {
        var ta = UI.qs('[data-campo="mensaje"]', card), as = UI.qs('[data-campo="asunto"]', card);
        if (ta && b.mensaje != null) ta.value = b.mensaje; if (as && b.asunto != null) as.value = b.asunto;
        card.setAttribute('data-editado', '1'); actualizarEnlace(card);
      }
      if (b.abierta) card.classList.add('abierta');
      if (b.inlineModo) { abrirInline(card, b.inlineModo, true); var t = UI.qs('[data-inline="texto"]', card), f = UI.qs('[data-inline="fecha"]', card); if (t) t.value = b.inlineTexto; if (f) f.value = b.inlineFecha; }
    });
  }
  function reemplazarTarjeta(card, item, hoy) {
    var tmp = document.createElement('div'); tmp.innerHTML = tarjetaHtml(item, hoy || U.hoyISO());
    var nueva = tmp.firstElementChild; card.parentNode.replaceChild(nueva, card); return nueva;
  }
  function quitarTarjeta(card) {
    var r = raiz(); var seccion = card.closest('.hoy-seccion'), grupo = card.closest('.hoy-grupo');

    if (seccion) { var n = UI.qsa('.hoy-card', seccion).length; if (!n) seccion.parentNode.removeChild(seccion); else { var cont = UI.qs('[data-contador]', seccion); if (cont) cont.textContent = n; } }
    var total = UI.qs('#hoy-cola [data-total]', r); if (total) total.textContent = UI.qsa('#hoy-cola .hoy-card', r).length;
    if (!UI.qsa('#hoy-cola .hoy-card', r).length) render();

  // KPIs, cuotas, "X de Y", lista de enviados y pie: lo que cambia con cada acción sin tocar las tarjetas
  function refrescarResumenes(hoy, cola) {

    var pie = UI.$('hoy-pie'); if (pie) pie.innerHTML = pieHtml(hoy, dia, cola);
    var env = UI.$('hoy-enviados'); if (env) { var abierto = !!UI.qs('details[open]', env); env.innerHTML = enviadosHoyHtml(hoy); var d = UI.qs('details', env); if (d && abierto) d.open = true; }
    var porSeg = enviadosPorSegmento(hoy);
    UI.qsa('#hoy-cola .hoy-grupo', r).forEach(function (g) { var seg = g.getAttribute('data-seg'); var xy = UI.qs('[data-xy]', g); if (xy) xy.textContent = U.entero(porSeg[seg] || 0) + ' de ' + U.entero(dia ? Number(dia.cuotas[seg]) || 0 : 0) + ' enviados'; });
  }
  // Tras una acción: la tarjeta desaparece, cambia o, si cambió de sección o entraron items nuevos, se redibuja todo conservando borradores
  function trasAccion(clave) {
    var hoy = U.hoyISO(); var cola = E.colaDelDia(hoy);
    var nuevos = {}; cola.forEach(function (it) { nuevos[claveDe(it)] = it; });
    var antes = estado.items[clave], ahora = nuevos[clave];
    var hayNuevos = Object.keys(nuevos).some(function (k) { return !estado.items[k]; });
    estado.items = nuevos;
    var card = tarjetaPorClave(clave);
    if (hayNuevos || (ahora && (!antes || !card || ahora.tipo !== antes.tipo || ahora.vencido !== antes.vencido))) { render(); return; }
    if (!ahora) { if (card) quitarTarjeta(card); }
    else reemplazarTarjeta(card, ahora, hoy);

  }

  /* =========================== Acciones =========================== */
  function plantillaElegida(card, item) { var sel = UI.qs('[data-campo="plantilla"]', card); if (!sel) return item.plantilla || null; return sel.value ? DB.buscar('plantillas', sel.value) : null; }

    var a = UI.qs('a[data-accion-hoy="abrir"]', card); if (!a) return;
    var pl = plantillaElegida(card, item); var canal = canalDe(c, pl);
    var ta = UI.qs('[data-campo="mensaje"]', card), as = UI.qs('[data-campo="asunto"]', card);

    actualizarEnlace(card); card.classList.add('abierta');
    UI.copiar(texto).then(function (ok) { UI.toast(ok ? 'Mensaje copiado · cuando lo envíe, pulse "Marcar enviado"' : 'No se pudo copiar; el texto va en el enlace', ok ? '' : 'alerta'); });

  function cambiarPlantilla(card, id) {

  // Completar una variable desde la tarjeta: se guarda en el contacto y rearma el mensaje (si no fue editado a mano)
  function guardarVariable(card, input) {

    var campo = input.getAttribute('data-var'); var v = input.value;

  function abrirInline(card, modo, forzar) {

    else if (modo === 'perdido') caja.innerHTML = '<label class="campo"><span>Motivo de pérdida</span><input data-inline="texto" placeholder="precio, fecha, sin interés…"></label><div class="acciones"><button type="button" class="btn peligro" data-accion-hoy="guardar-perdido">Marcar perdido</button><button type="button" class="btn chico" data-accion-hoy="cancelar-inline">Cancelar</button></div>';

  function cerrarInline(card) { var caja = UI.qs('.hoy-inline', card); if (caja) { caja.hidden = true; caja.innerHTML = ''; caja.removeAttribute('data-modo'); } }
  function textoInline(card, nombre) { var el = UI.qs('[data-inline="' + nombre + '"]', card); return el ? el.value.trim() : ''; }
  // Si el contacto ya tiene una cotización abierta se edita esa (para marcarla pagada) en vez de duplicar la venta
  function abrirVenta(c) {
    var abierta = DB.tabla('ventas').filter(function (v) { return v.contactoId === c.id && (v.estado === 'cotizado' || v.estado === 'link_enviado'); })
      .sort(function (a, b) { return String(b.fecha || '') > String(a.fecha || '') ? 1 : -1; })[0] || null;

  // Pide un texto en un modal (para la lista de enviados, donde no hay tarjeta)

  function accionContacto(acc, el, card, item) {

  function accionCuenta(acc, card) {

  function accion(acc, el, card, fila) {
    if (acc === 'ver-mas') { var k = el.getAttribute('data-limite'); estado.limites[k] = (estado.limites[k] || LIMITES[k.split(':')[0]] || 20) + PASO_VER_MAS; render(); return; }

  // Los eventos se enlazan una sola vez sobre la sección, que el núcleo nunca reemplaza

      if (el.getAttribute('data-accion-hoy') === 'abrir') { if (card) copiarMensaje(card, ev); return; } // el enlace abre WhatsApp o el correo

  /* =========================== Cierre del día =========================== */

  }
  // Fija el estado del día del calendario con una nota automática y muestra el resumen copiable
  function cerrarDia() {

    render();
    mostrarResumen(hoy);
  }

  V.registrarPantalla('hoy', render);
  V.hoy = { render: render, textoResumen: textoResumen, cerrarDia: cerrarDia, resumenHoy: resumenHoy };
})();

</script>
<script>
/* ---- módulo: metricas.js ---- */
/* ============================================================================

(function () {

  /* =========================== Periodo =========================== */
  function filtros() {

  }
  function en(fecha, r) { fecha = U.isoDe(fecha); return !!fecha && fecha >= r.desde && fecha <= r.hasta; }
  function fechaVenta(v) { return U.isoDe(v.fechaCierre) || U.isoDe(v.fecha) || ''; }

  /* =========================== Cálculos =========================== */
  function datos(r) {
    r = r || rango(); var porId = {}; DB.tabla('contactos').forEach(function (c) { porId[c.id] = c; });

    var ventas = DB.tabla('ventas').filter(function (v) { return cuenta(v) && en(fechaVenta(v), r); });

    ventas.forEach(function (v) { if (v.contactoId) { comp[v.contactoId] = 1; cont[v.contactoId] = cont[v.contactoId] || 1; } });
    oportunidades.forEach(function (v) { if (v.contactoId) prop[v.contactoId] = 1; });
    Object.keys(cont).forEach(function (id) { var c = porId[id]; if (c && V.ORDEN_ETAPAS.indexOf(c.etapa) >= V.ORDEN_ETAPAS.indexOf('proponer')) prop[id] = 1; });
    var porSeg = {};

    Object.keys(cont).forEach(function (id) { var k = seg(id); if (k) { porSeg[k].contactados++; if (resp[id]) porSeg[k].respondieron++; if (prop[id]) porSeg[k].propuestas++; if (comp[id]) porSeg[k].compraron++; } });
    ventas.forEach(function (v) { var k = (v.contactoId && seg(v.contactoId)) || (porSeg[v.segmento] ? v.segmento : null); if (k) { porSeg[k].venta += Number(v.total) || 0; porSeg[k].ventas++; } });
    var tot = { contactados: Object.keys(cont).length, respondieron: Object.keys(resp).filter(function (id) { return cont[id]; }).length, propuestas: Object.keys(prop).filter(function (id) { return cont[id]; }).length, compraron: Object.keys(comp).length, venta: ventas.reduce(function (s, v) { return s + (Number(v.total) || 0); }, 0), ventas: ventas.length };
    var bot = ventas.filter(function (v) { return v.linea !== 'experiencia'; }), exp = ventas.filter(function (v) { return v.linea === 'experiencia'; });

    var P = periodoPlan(); var ventas = DB.tabla('ventas').filter(function (v) { return cuenta(v) && en(fechaVenta(v), P); });

  }

    return cfg().cortes.map(function (c) {
      var meta = cal.filter(function (d) { return d.fecha <= c.fecha; }).reduce(function (s, d) { return s + (Number(d.metaDia) || 0); }, 0);

      var real = todas.filter(function (v) { return fechaVenta(v) <= c.fecha; }).reduce(function (s, v) { return s + (Number(v.total) || 0); }, 0);

    });
  }
  function alertaCorte() {
    var hoy = U.hoyISO(); var cal = DB.tabla('calendario'); var P = periodoPlan(); var M = cfg().metas;
    var proximo = cfg().cortes.filter(function (c) { return c.fecha >= hoy; })[0] || cfg().cortes[cfg().cortes.length - 1]; if (!proximo) return null;
    var todas = DB.tabla('ventas').filter(function (v) { return cuenta(v) && en(fechaVenta(v), P); });
    var acum = todas.reduce(function (s, v) { return s + (Number(v.total) || 0); }, 0);
    var transcurridos = cal.filter(function (d) { return d.fecha <= hoy; }), restantes = cal.filter(function (d) { return d.fecha > hoy; });
    var metaHoy = transcurridos.reduce(function (s, d) { return s + (Number(d.metaDia) || 0); }, 0), cuotaHoy = transcurridos.reduce(function (s, d) { return s + (Number(d.cuotaDia) || 0); }, 0);
    var metaTotal = Number(M.total) || Object.keys(M.proyeccion || {}).reduce(function (s, k) { return s + (Number(M.proyeccion[k]) || 0); }, 0);
    var ritmoActual = transcurridos.length ? acum / transcurridos.length : 0;
    var ritmoRequerido = restantes.length ? Math.max(0, metaTotal - acum) / restantes.length : 0;
    var d = datos({ desde: P.desde, hasta: P.hasta });

    var contactosReq = Math.ceil(ritmoRequerido / (ticket * tasa)); var contactosAct = transcurridos.length ? Math.round(d.tot.contactados / transcurridos.length) : 0;

      kpi('Acumulado a hoy', U.soles(al.acumulado)) + kpi('Meta acumulada a hoy', U.soles(al.metaALaFecha)) + kpi('Cuota acumulada a hoy', U.soles(al.cuotaALaFecha)) + kpi('Ritmo actual', U.soles(al.ritmoActual) + '<small>/día</small>') + kpi('Ritmo requerido', U.soles(al.ritmoRequerido) + '<small>/día</small>', al.ritmoRequerido > al.ritmoActual ? 'mal' : '') + kpi('Contactos/día requeridos', U.entero(al.contactosDiaRequeridos) + '<small> vs ' + U.entero(al.contactosDiaActuales) + ' hoy</small>') + '</div><p class="texto3">Contactos/día requeridos = ritmo requerido ÷ (ticket promedio ' + U.soles(al.ticket) + ' × tasa de compra ' + U.pct(al.tasaCompra, 1) + '). Días de atención restantes: ' + al.diasRestantes + '.</p></div>';
